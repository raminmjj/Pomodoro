name: Continuous Integration
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --logger trx
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false
  build:
    name: Build
    needs: test
    uses: ./.github/workflows/build.yml
  version:
    name: Prepare version string
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      debian_version: ${{ steps.version.outputs.debian_version }}
      product_version: ${{ steps.version.outputs.product_version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Output version string
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # determine base canonical version (from tag or fallback)
          if [[ "$TAG" == v* ]]; then
            CANONICAL="${TAG#v}"
          else
            CANONICAL="0.0.0-dev"
          fi

          # debian: replace '-' with '~'
          DEBIAN_VERSION="${CANONICAL//-/~}"

          # product_version for Windows: keep up to 4 numeric parts, fill with zeros
          # extract numeric parts from canonical (non-numeric parts become zeros)
          # Example: 1.2.3-dev -> 1.2.3.0 ; 0.0.0-dev -> 0.0.0.0
          NUMS=$(echo "$CANONICAL" | sed -E 's/^([0-9]+(\.[0-9]+){0,3}).*$/\1/;s/\.$//')
          IFS='.' read -r -a parts <<< "$NUMS"
          p0=${parts[0]:-0}; p1=${parts[1]:-0}; p2=${parts[2]:-0}; p3=${parts[3]:-0}
          PRODUCT_VERSION="$p0.$p1.$p2.$p3"

          # export outputs for the workflow
          echo "version=$CANONICAL" >> "$GITHUB_OUTPUT"
          echo "debian_version=$DEBIAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "product_version=$PRODUCT_VERSION" >> "$GITHUB_OUTPUT"
  package:
    needs: [build, version]
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
