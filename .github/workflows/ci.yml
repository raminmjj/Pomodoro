name: CI/CD

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_ROLL_FORWARD: 'Major'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --logger trx
      - uses: codecov/codecov-action@v5
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: Pomodoro-win-x64.zip
          - os: macos-latest
            rid: osx-arm64
            artifact: Pomodoro-osx-arm64.tar.gz
          - os: ubuntu-latest
            rid: linux-x64
            artifact: Pomodoro-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH_DIR: src/Pomodoro.App/bin/Release/net10.0/${{ matrix.rid }}/publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (AOT)
        shell: bash
        run: >
          dotnet publish src/Pomodoro.App/Pomodoro.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishAot=true

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path $env:PUBLISH_DIR/* -DestinationPath ${{ matrix.artifact }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: tar -czf ${{ matrix.artifact }} -C "$PUBLISH_DIR" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # download-artifact puts each artifact in its own subdirectory;
      # merge-multiple flattens them so the release globs below can match.
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.zip
            *.tar.gz
